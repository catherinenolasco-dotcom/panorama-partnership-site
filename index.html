/* ---- LaunchDarkly portfolio treatment ---- */
body { font-size: 16px; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-weight: 700; letter-spacing: -0.04em; }
:focus-visible { outline-color: var(--link); }
.bar { background: #0C0C0C; border-bottom: 1px solid #2B2B2B; }
.brand { font-weight: 700; letter-spacing: -0.04em; font-size: 22px; }
.nav button { color: #F2F2F2; }

.co select { background: var(--bg); }
.crumb, .ext { color: var(--link); }
.hero { background-color: #111; background-image: linear-gradient(#222 1px, transparent 1px), linear-gradient(90deg, #222 1px, transparent 1px); background-size: 86px 86px; background-position: center top; border: 1px solid #2B2B2B; border-radius: 28px; padding: 40px 32px 34px; }
@media (max-width: 520px) { .hero { padding: 28px 20px; } }
.hero h1 { letter-spacing: -0.05em; }
.tagline { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.04em; font-size: clamp(22px, 3vw, 32px); line-height: 1.1; color: var(--accent); margin-top: 14px; }
.band { position: relative; overflow: hidden; margin: 18px 0 24px; border-radius: 28px; padding: 28px 20px; background: linear-gradient(100deg, #FFD0F0 0, #FF6FB5 38%, #FF4D6D 78%); }
.band::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(25,25,25,.16) 1px, transparent 1px), linear-gradient(90deg, rgba(25,25,25,.16) 1px, transparent 1px); background-size: 86px 86px; pointer-events: none; }
.stats { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: #191919; border-radius: 18px; padding: 20px 18px; min-width: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: clamp(36px, 5vw, 52px); line-height: 0.95; letter-spacing: -0.05em; color: #fff; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.35; }
.tag, .srow .l { color: var(--accent); }
.tile, .qrow, .fitrow, .pcard, .quizcta, details.story, .mode, .opt { border-radius: 18px; }
.tile { background: var(--surface); }
.tile:hover, .qrow:hover, .btn:hover, .opt:hover:not([disabled]) { border-color: var(--accent); }
.meter b { background: var(--link); opacity: 1; }
.prog .pb i { background: var(--accent); }
.btn { border-radius: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:not(.small)::after { content: "\2192"; margin-left: 10px; font-size: 18px; }
.btn.primary:hover { filter: none; background: #EAFF7A; border-color: #EAFF7A; }
.fact { border: 1px solid var(--line); background: transparent; color: #F2F2F2; border-radius: 10px 10px 10px 22px; padding: 6px 14px; }
.badge { border-radius: 8px 14px 8px 8px; background: var(--surface2); color: var(--muted); }
.badge.ask { background: var(--blue); color: #fff; }
.seg button { border-radius: 8px 18px 8px 8px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mode[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); box-shadow: none; }
.mode[aria-pressed="true"] b { color: var(--accent); }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
.gapbox { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; }
input[type="text"], textarea { background: var(--bg); border-color: var(--line); }
input[type="text"]::placeholder, textarea::placeholder { color: #8E9099; }
strong.filled { background: var(--accent-soft); color: var(--accent); }
.verdict { border-radius: 14px; }
.hidepart { border-color: var(--accent-line); }
.panel { border-radius: 18px; }
.panel.paper { background: var(--paper); color: var(--paper-ink); border-color: var(--paper); border-radius: 24px; }
.paper h2, .paper .script { color: var(--paper-ink); }
.paper .scriptmeta { color: var(--paper-mut); }
.paper .btn { background: transparent; color: var(--paper-ink); border-color: var(--paper-ink); }
.paper .btn:hover { background: var(--paper-ink); color: var(--paper); border-color: var(--paper-ink); }
.paper .tip { color: var(--paper-mut); border-top-color: #C9CBD2; }

.paper strong.filled { background: var(--accent); color: #191919; }
.paper mark.gap { background: var(--gap); color: #191919; }
.fitrow { border-radius: 18px; }
.badge.fit-strong { background: var(--good-soft); color: var(--good); }
.badge.fit-partial { background: var(--warn-soft); color: var(--warn); }
.badge.fit-gap { background: var(--bad-soft); color: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .tile, .qrow, .opt, .btn { transition: border-color 0.15s ease; } }

/* ---- iPad and iPhone layout ---- */

      '<section class="abwf"><div class="ey">How it would run</div><h2>From form to final sign-off</h2><p class="abp">The same steps you just clicked through, as the real flow.</p><div class="abstage">' + eafFlow() + "</div></section>" +
      '<section class="abwf"><div class="ey">Approval rules</div><h2>Who must approve each change</h2><p class="abp">The form reads this table. A dot means that approver is required. Payroll always signs off last. These rules are Cat&rsquo;s proposal, to adjust with Angela and Payroll. The executive team applies to out-of-cycle pay changes, as Angela described. Some of those executives may also be the HR and Finance approvers under different titles (for example the CPO and CFO). If so, one person can satisfy both, and we would confirm that with Angela. Merit and promotion cycles would run on their own approvals.</p>' + window.EAF.rules() + "</section>" +

  function cdParts() {
    var ms = new Date(2027, 0, 1, 0, 0, 0) - new Date();
    if (ms <= 0) return null;
    var t = Math.floor(ms / 1000);
    return { d: Math.ceil(ms / 864e5), dd: Math.floor(t / 86400), h: Math.floor(t % 86400 / 3600), m: Math.floor(t % 3600 / 60), s: t % 60 };
  }
  function countdown() {
    var c = cdParts();
    if (!c) return '<div class="cdn"><div class="cdn-t"><b>Rippling is live</b><span>Go-live was January 1, 2027.</span></div></div>';
    return '<div class="cdn" id="cdn"><div class="cdn-n" id="cdn-d">' + c.d + '</div><div class="cdn-t"><b>' + (c.d === 1 ? "day" : "days") + ' until Rippling goes live</b><span>January 1, 2027. Panorama is not renewing ADP, so this date is fixed.</span><em class="cdn-note">That is about ' + Math.max(1, Math.round(c.d / 7)) + ' weeks from today, with Thanksgiving and the December 24 to January 1 closure inside it. From Cat&rsquo;s experience, a typical Rippling implementation runs 4 to 6 months, including extra time for UAT so all data and workflows are configured and tested properly. The window here is shorter, so the plan is built around scope and sequencing.</em></div><div class="cdn-u" id="cdn-u" aria-hidden="true">' + cdUnits(c) + "</div></div>";
  }
  function cdUnits(c) { return [[c.h, "hrs"], [c.m, "min"], [c.s, "sec"]].map(function (x) { return "<span><i>" + String(x[0]).padStart(2, "0") + "</i><small>" + x[1] + "</small></span>"; }).join(""); }
  setInterval(function () {
    var u = document.getElementById("cdn-u"); if (!u) return;
    var c = cdParts(); if (!c) { render(); return; }
    u.innerHTML = cdUnits(c); document.getElementById("cdn-d").textContent = c.d;
  }, 1000);
  function pgTimeline() {
    return head("Rippling timeline", "October to go-live", "") + countdown() + '<div style="margin-top:14px">' + timelineSection() + "</div>" +
      '<section class="hubsec"><h2>Erica to Cat: the handoff</h2><p class="sub">Erica is leading the Rippling implementation today. She hands it to Cat once Cat is in and moves to a supporting role. Dates here are Cat&rsquo;s proposal, to confirm with her and Lisa.</p><div class="abstep"><div class="abs"><span class="n">BEFORE CAT STARTS</span><h4>Erica leads</h4><p>She is leading the Rippling implementation today.</p></div><div class="abs"><span class="n">CAT&rsquo;S FIRST WEEKS</span><h4>Learn it with her</h4><p>Walk the build together: what is configured, what is open, the decisions made and why, and who to call at Rippling.</p></div><div class="abs"><span class="n">HANDOFF</span><h4>Written and agreed</h4><p>One page of owners, open items and the date she steps back, shared with Eric and Angela so nobody is guessing who to ask.</p></div><div class="abs"><span class="n">AFTER</span><h4>Cat owns it</h4><p>Erica steps back to a supporting role, and we agree up front how involved she stays, for example around testing. Cat carries it through shadow payroll, go-live and stabilize.</p></div></div></section><section class="hubsec"><h2>Where automation lands</h2><p class="sub">After Rippling stabilizes, not before. Nothing needs to be live before year-end.</p><div class="abstep"><div class="abs"><span class="n">NOV TO JAN 1</span><h4>Rippling first</h4><p>Shadow payrolls and go-live. Automation stays out of the way.</p></div><div class="abs"><span class="n">Q1 2027</span><h4>Onboarding and meeting capture</h4><p>The quick wins, built in Zapier.</p></div><div class="abs"><span class="n">THEN</span><h4>Payroll governance layer</h4><p>Once Rippling\'s own approvals are live, wrapped around it rather than duplicating it.</p></div></div><div class="toolrow" style="margin-top:12px"><a class="btn" href="#/claude" data-go="claude">See where Claude fits</a></div></section>' + nextRow(["overlap", "eric", "angela", ""]);
  }
  function render() {

    document.getElementById("topnav").innerHTML = nav();
    document.getElementById("hero").innerHTML = route === "" ? heroHtml() : "";
    document.getElementById("app").innerHTML = fn();
  }
  function go(r) {
    route = ROUTES.some(function (x) { return x[0] === r; }) ? r : "";
    try { if (location.hash !== href(route)) history.replaceState(null, "", route ? href(route) : location.pathname + location.search); } catch (x) {}
    render(); window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (t) {
      var act = t.getAttribute("data-act"), v = t.getAttribute("data-v");
      if (act === "vsel") { vsel = v; document.getElementById("vensec").innerHTML = vennSection(); return; }

      if (act === "wf-ai") { var sv2 = document.getElementById("wfsvg-" + v); if (sv2) { var on = sv2.classList.toggle("aion"); t.classList.toggle("aion", on); t.setAttribute("aria-pressed", on ? "true" : "false"); } return; }
      if (act === "rw-f") { RW_LV = v; document.querySelectorAll('[data-act="rw-f"]').forEach(function (b) { b.classList.toggle("primary", b === t); }); document.getElementById("rwdetail").innerHTML = rwDetail(); return; }
      if (act === "rw-cat") { RW_CAT = +v; document.querySelectorAll(".rwpost").forEach(function (b) { var on = b === t; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); }); document.getElementById("rwdetail").innerHTML = rwDetail(); var dt = document.getElementById("rwdetail"); if (dt && dt.scrollIntoView) dt.scrollIntoView({ behavior: "smooth", block: "nearest" }); return; }
      if (act === "rw-scroll") { var pr = v.split(":"), el = document.getElementById(pr[0]); if (el) el.scrollBy({ left: +pr[1] * Math.max(240, el.clientWidth * 0.8), behavior: "smooth" }); return; }
      if (act === "wf-run") { wfRun(v); return; }

  });
  document.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("data-act") === "wf-node") { e.preventDefault(); wfNarr(e.target.getAttribute("data-v"), e.target.getAttribute("data-id")); } });
  window.addEventListener("hashchange", function () { var h = (location.hash || "").replace(/^#\/?/, ""); if (h === "automation") h = "claude"; if (h !== route) { route = ROUTES.some(function (x) { return x[0] === h; }) ? h : ""; render(); window.scrollTo(0, 0); } });

  render();
})();
